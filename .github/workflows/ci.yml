name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn
      - name: Seeds run on every fold
        run: |
          set -e
          for t in kmeans logistic_regression knn; do
            python harness/evaluate.py --task $t --seed-file --folds 2 --repeats 1 \
              | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok' and d['n_folds_ok']==d['n_folds_total'], d; print('$t ok', d['quality'])"
          done
      - name: Forbidden imports are rejected
        run: |
          printf 'from sklearn.neighbors import KNeighborsClassifier as Model\n' > /tmp/cheat.py
          python harness/evaluate.py --task knn --candidate /tmp/cheat.py \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='forbidden_import', d; print('rejected ok')"
