[package]
name = "competeevolve"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures = "0.3.34"
gemini-rust = "2.0.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full","rt", "rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"]}
csv = "1"
tempfile = "3"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ab_glyph"] }
