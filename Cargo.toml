[package]
name = "competeevolve"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
futures = "0.3"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
